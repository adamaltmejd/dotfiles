# Terminal behavior
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -g set-clipboard on
set -g focus-events on
set -g mouse on
set -g history-limit 100000
set -g update-environment "DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_CONNECTION SSH_TTY"
set -g detach-on-destroy off
set -g display-time 2000
set -g repeat-time 750

# § is the desktop prefix; Ctrl-g is easier to reach from mobile clients.
# Press either prefix twice to send it literally to the application.
unbind C-b
set -g prefix "§"
set -g prefix2 C-g
bind "§" send-prefix
bind C-g send-prefix -2

# Keep window numbering predictable as windows are closed.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# A high-contrast top bar makes the remote host hard to overlook.
set -g status-position top
set -g status-interval 15
set -g status-style "bg=colour234,fg=colour223"
set -g status-left-length 60
set -g status-right-length 50
set -g status-left "#[bg=colour214,fg=colour232,bold] HOST: #($HOME/.config/tmux/host-label) #[bg=colour31,fg=colour231,bold] #S #[default]"
set -g status-right "#{?client_prefix,#[bg=colour196,fg=colour231,bold] PREFIX #[default] ,}#{?window_zoomed_flag,#[fg=colour214,bold] ZOOM #[default] ,}#[fg=colour245]#{session_attached}c %H:%M "

setw -g window-status-format " #I:#W#F "
setw -g window-status-current-format "#[bg=colour31,fg=colour231,bold] #I:#W#F #[default]"
setw -g monitor-activity on
set -g activity-action other
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour214"
set -g message-style "bg=colour214,fg=colour232,bold"

# Preserve the current directory when opening panes and windows.
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Repeatable pane navigation and five-cell resizing.
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind Tab last-window

# Mobile-friendly aliases for entering and paging through copy mode.
bind v copy-mode
bind u copy-mode -u

bind r source-file "$HOME/.config/tmux/tmux.conf" \; display-message "tmux config reloaded"
