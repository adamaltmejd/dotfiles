# Terminal behavior
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -g focus-events on
set -g mouse on
set -g history-limit 100000
set -g update-environment "DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_CONNECTION SSH_TTY"

# A single § is the command prefix; press it twice to send a literal §.
unbind C-b
set -g prefix "§"
bind "§" send-prefix

# Keep window numbering predictable as windows are closed.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# A high-contrast top bar makes the remote host hard to overlook.
set -g status-position top
set -g status-interval 15
set -g status-style "bg=colour234,fg=colour223"
set -g status-left-length 40
set -g status-left "#[bg=colour214,fg=colour232,bold] HOST: #($HOME/.config/tmux/host-label) #[default]"
set -g status-right "#[fg=colour245]%Y-%m-%d %H:%M "

setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=colour31,fg=colour231,bold] #I:#W #[default]"
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour214"
set -g message-style "bg=colour214,fg=colour232,bold"

# Preserve the current directory when opening panes and windows.
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind r source-file "$HOME/.config/tmux/tmux.conf" \; display-message "tmux config reloaded"
